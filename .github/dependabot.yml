version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /plugin
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      pi-sdk:
        patterns:
          - '@earendil-works/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Shanghai
    groups:
      actions:
        patterns:
          - '*'
